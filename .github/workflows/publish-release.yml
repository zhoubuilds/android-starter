name: Publish Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "main" ]]; then
              echo "::error::Manual release builds must run from main."
              exit 1
            fi
            exit 0
          fi

          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $REF_NAME"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in SIGNING_KEY STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required signing secret is missing: $secret_name"
              exit 1
            fi
          done

          printf '%s' "$SIGNING_KEY" \
            | base64 --decode \
            > "$RUNNER_TEMP/android-starter-demo.jks"
          chmod 600 "$RUNNER_TEMP/android-starter-demo.jks"

      - name: Test and build signed APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/android-starter-demo.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew test :app:assembleRelease \
            --no-configuration-cache \
            --no-daemon

      - name: Verify and prepare APK
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "::error::Signed release APK was not generated."
            exit 1
          fi

          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner -print \
            | sort -V \
            | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk_path"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            asset_version="$GITHUB_REF_NAME"
          else
            asset_version="manual-${GITHUB_SHA:0:7}"
          fi

          mkdir -p dist
          cp "$apk_path" "dist/android-starter-${asset_version}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-starter-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
